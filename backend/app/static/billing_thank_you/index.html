<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payment Received</title>
<style>
  :root {
    --purple: #6A4FE0;
    --text: #1a1a2e;
    --muted: #5a5a6e;
    --bg: #fdfbff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    max-width: 420px;
    text-align: center;
    padding: 40px 32px;
  }
  .badge {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--purple);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 700;
    font-size: 22px;
    margin: 0 auto 24px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  p { color: var(--muted); line-height: 1.6; margin: 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">PD</div>
    <h1>Payment received</h1>
    <p>
      Thank you — your GuardianPD invoice payment is being processed.
      It may take a few minutes to reflect in your school's account.
      You can close this window.
    </p>
  </div>
</body>
</html>

workflows:
  android-alpha:
    name: GuardianPD - Android Closed Testing (Alpha)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile
    environment:
      flutter: stable
      groups:
        # Create these groups under Codemagic > Team settings > Environment
        # variables (or per-app settings) — see the setup notes below for
        # exactly which variables each one holds.
        - android_signing
        - google_play
        - firebase_config
    scripts:
      - name: Write Android release-signing config
        script: |
          # Recreates android/app/upload-keystore.jks + android/key.properties
          # on the build machine - both are gitignored in this repo (see
          # android/.gitignore), so CI has to reconstruct them from secret
          # environment variables rather than reading them from the checkout.
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/mobile/android/app/upload-keystore.jks"
          cat > "$CM_BUILD_DIR/mobile/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_BUILD_DIR/mobile/android/app/upload-keystore.jks
          EOF
      - name: Write Firebase Android config
        script: |
          # google-services.json is also gitignored (android/.gitignore) —
          # same reasoning as the keystore above.
          echo "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON" | base64 --decode > "$CM_BUILD_DIR/mobile/android/app/google-services.json"
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Build release AAB
        script: |
          # Without this, ApiClient.baseUrl (mobile/lib/core/api_client.dart)
          # falls back to its local-dev default (http://10.0.2.2:8000 on
          # Android) — meaningless on a real device, since that only
          # resolves to the host machine from an emulator.
          flutter build appbundle --release --dart-define=API_BASE_URL=https://guardianpd-production.up.railway.app
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/**/mapping.txt
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: alpha
        submit_as_draft: false

  ios-testflight:
    name: GuardianPD - iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile
    integrations:
      # Register this once in Codemagic > Team settings > Integrations >
      # Developer Portal, name it "codemagic" (or update the name below to
      # match whatever you called it) — it needs an App Store Connect API
      # key with App Manager permission. Codemagic then fetches/creates the
      # right signing certificate + provisioning profile automatically.
      app_store_connect: codemagic
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.schoolqr.mobile
      groups:
        - firebase_config
    scripts:
      - name: Write Firebase iOS config
        script: |
          # GoogleService-Info.plist is gitignored (ios/.gitignore) — same
          # reasoning as Android's google-services.json above.
          echo "$FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > "$CM_BUILD_DIR/mobile/ios/Runner/GoogleService-Info.plist"
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build ipa
        script: |
          # Without this, ApiClient.baseUrl (mobile/lib/core/api_client.dart)
          # falls back to its local-dev default (http://localhost:8000) —
          # meaningless on a real device, since that just means "this
          # iPhone itself." This is what caused the blank-screen hang on a
          # real iPhone 17 Pro: every API call silently failed to connect.
          flutter build ipa --release \
            --dart-define=API_BASE_URL=https://guardianpd-production.up.railway.app \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

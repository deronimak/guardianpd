<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GuardianPD School Admin</title>
<style>
  :root {
    --bg: #f5f6fa;
    --panel: #ffffff;
    --border: #e1e4ea;
    --text: #1a1d29;
    --text-muted: #6b7280;
    --accent: #6a4fe0;
    --accent-hover: #5a3fd0;
    --danger: #dc2626;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .auth-row { display: flex; align-items: center; gap: 12px; font-size: 13px; }
  header .auth-row a { color: var(--accent); text-decoration: none; cursor: pointer; }
  header .auth-row a:hover { text-decoration: underline; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 32px 64px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 24px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 16px; color: var(--text); }
  .panel h2 .hint { font-weight: 400; color: var(--text-muted); font-size: 12px; }
  form.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  form label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px; }
  form input, form select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  form .full { grid-column: 1 / -1; }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  button.secondary:hover { background: #f1eefb; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .empty { color: var(--text-muted); font-size: 13px; padding: 8px 0; }
  .success-banner {
    background: #f1eefb;
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .guardian-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .guardian-card .name { font-weight: 600; }
  .guardian-card .meta { color: var(--text-muted); font-size: 12px; margin: 2px 0 8px; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .row-actions button { padding: 6px 12px; font-size: 12px; }
  #log {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    background: #0f1117;
    color: #d1d5db;
    border-radius: var(--radius);
    padding: 16px 20px;
    max-height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #log .ok { color: #86efac; }
  #log .err { color: #fca5a5; }

  #login-home {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  .login-card h2 { margin: 0 0 20px; font-size: 17px; }
  .login-card input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 10px;
  }
  .login-card button { width: 100%; padding: 10px; margin-top: 6px; }
  .login-card .error { color: var(--danger); font-size: 12px; margin-bottom: 10px; }
</style>
</head>
<body>

<header>
  <h1>GuardianPD School Admin</h1>
  <div class="auth-row" id="auth-area"></div>
</header>

<div id="login-home">
  <div class="login-card">
    <h2>School Admin Login</h2>
    <div class="error" id="login-error" style="display:none;"></div>
    <input type="text" id="login-slug" placeholder="School slug" autocomplete="off" />
    <input type="email" id="login-email" placeholder="you@example.com" autocomplete="username" />
    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" />
    <button onclick="login()">Log in</button>
  </div>
</div>

<main id="dashboard" style="display:none;">
  <div class="panel">
    <h2>Add guardian &amp; children <span class="hint">POST /guardians</span></h2>
    <div id="add-guardian-success"></div>
    <form class="grid" id="add-guardian-form" onsubmit="return addGuardian(event)">
      <div>
        <label>Guardian's full name</label>
        <input required id="f-name" placeholder="Amara Chukwu" />
      </div>
      <div>
        <label>Email</label>
        <input required type="email" id="f-email" placeholder="amara@example.com" />
      </div>
      <div>
        <label>Phone number</label>
        <input id="f-phone" placeholder="+2348012345678" />
      </div>
      <div>
        <label>Number of children</label>
        <select id="f-child-count" onchange="renderChildInputs()">
          <option value="0">0</option>
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
        </select>
      </div>
      <div class="full" id="child-inputs"></div>
      <div class="full">
        <button type="submit">Add guardian</button>
      </div>
    </form>
  </div>

  <div class="panel">
    <h2>Search guardians <span class="hint">GET /guardians</span></h2>
    <div class="row-actions" style="margin-bottom:14px;">
      <input type="text" id="search-query" placeholder="Name, email, or phone" style="flex:1; padding:9px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px;"
             onkeydown="if(event.key==='Enter') searchGuardians()" />
      <button onclick="searchGuardians()">Search</button>
    </div>
    <div id="search-results"><p class="empty">Search for a guardian to print their QR credential again or resend their activation email.</p></div>
  </div>

  <div class="panel">
    <h2>Activity log</h2>
    <div id="log">Nothing yet.</div>
  </div>
</main>

<script>
  function getToken() { return localStorage.getItem("school_admin_token") || ""; }
  function setToken(token) { localStorage.setItem("school_admin_token", token); }
  function clearToken() { localStorage.removeItem("school_admin_token"); }
  function getSlug() { return localStorage.getItem("school_admin_slug") || ""; }
  function setSlug(slug) { localStorage.setItem("school_admin_slug", slug); }

  function log(message, ok) {
    const el = document.getElementById("log");
    const line = document.createElement("div");
    line.className = ok ? "ok" : "err";
    const ts = new Date().toLocaleTimeString();
    line.textContent = `[${ts}] ${message}`;
    if (el.textContent === "Nothing yet.") el.textContent = "";
    el.prepend(line);
  }

  async function apiFetch(path, options = {}) {
    const token = getToken();
    const headers = Object.assign(
      { "Content-Type": "application/json", "X-School-Slug": getSlug() },
      options.headers || {}
    );
    if (token) headers["Authorization"] = `Bearer ${token}`;
    const response = await fetch(path, Object.assign({}, options, { headers }));
    if (response.status === 401) {
      clearToken();
      renderAuthArea();
    }
    if (options.raw) return response;
    const text = await response.text();
    let body;
    try { body = JSON.parse(text); } catch { body = text; }
    if (!response.ok) {
      const detail = typeof body === "object" ? JSON.stringify(body) : body;
      throw new Error(`${response.status} ${detail}`);
    }
    return body;
  }

  function renderAuthArea() {
    const area = document.getElementById("auth-area");
    const loggedIn = !!getToken();
    document.getElementById("login-home").style.display = loggedIn ? "none" : "flex";
    document.getElementById("dashboard").style.display = loggedIn ? "block" : "none";
    area.innerHTML = loggedIn
      ? `<span style="color:var(--text-muted)">${getSlug()}</span><button class="secondary" onclick="logout()">Log out</button>`
      : "";
  }

  async function login() {
    const slug = document.getElementById("login-slug").value.trim();
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    const errorEl = document.getElementById("login-error");
    errorEl.style.display = "none";
    if (!slug || !email || !password) return;
    setSlug(slug);
    try {
      const body = await apiFetch("/auth/staff/login", {
        method: "POST",
        body: JSON.stringify({ email, password }),
      });
      if (body.role !== "admin") {
        errorEl.textContent = "This is a School Staff account — School Admin access is required here.";
        errorEl.style.display = "block";
        return;
      }
      setToken(body.access_token);
      renderAuthArea();
      log(`Logged in to ${slug} as ${email}.`, true);
      renderChildInputs();
    } catch (e) {
      errorEl.textContent = `Login failed: ${e.message}`;
      errorEl.style.display = "block";
    }
  }

  function logout() {
    clearToken();
    renderAuthArea();
    log("Logged out.", true);
  }

  function renderChildInputs() {
    const count = parseInt(document.getElementById("f-child-count").value, 10) || 0;
    const container = document.getElementById("child-inputs");
    let html = "";
    for (let i = 1; i <= count; i++) {
      html += `
        <div style="margin-bottom:12px;">
          <label>Child ${i}'s full name</label>
          <input required class="child-name-input" placeholder="Full name" />
        </div>`;
    }
    container.innerHTML = html;
  }

  async function addGuardian(event) {
    event.preventDefault();
    const children = Array.from(document.querySelectorAll(".child-name-input"))
      .map((input) => input.value.trim())
      .filter((name) => name.length > 0)
      .map((name) => ({ name }));
    const payload = {
      name: document.getElementById("f-name").value.trim(),
      email: document.getElementById("f-email").value.trim(),
      phone: document.getElementById("f-phone").value.trim() || null,
      children,
    };
    try {
      const guardian = await apiFetch("/guardians", { method: "POST", body: JSON.stringify(payload) });
      log(`Enrolled "${guardian.name}" with ${guardian.children.length} child(ren) — activation email sent.`, true);
      document.getElementById("add-guardian-success").innerHTML = `
        <div class="success-banner">
          <strong>${guardian.name}</strong> enrolled${guardian.children.length ? " with " + guardian.children.map((c) => c.name).join(", ") : ""}.
          <div class="row-actions" style="margin-top:10px;">
            <button onclick="printCredential('${guardian.id}', '${escapeAttr(guardian.name)}')">Print QR credential</button>
          </div>
        </div>`;
      event.target.reset();
      document.getElementById("f-child-count").value = "1";
      renderChildInputs();
    } catch (e) {
      log(`Enroll failed: ${e.message}`, false);
    }
    return false;
  }

  function escapeAttr(value) {
    return String(value).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }

  async function printCredential(guardianId, guardianName) {
    try {
      const response = await apiFetch(`/guardians/${guardianId}/qr-credential.pdf`, { raw: true });
      if (!response.ok) throw new Error(`${response.status}`);
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      window.open(url, "_blank");
      log(`Opened QR credential for ${guardianName} — use the browser's print button.`, true);
    } catch (e) {
      log(`Could not open QR credential: ${e.message}`, false);
    }
  }

  async function resendActivation(guardianId, guardianName) {
    try {
      await apiFetch(`/guardians/${guardianId}/resend-activation`, { method: "POST" });
      log(`Activation email resent to ${guardianName}.`, true);
    } catch (e) {
      log(`Resend failed: ${e.message}`, false);
    }
  }

  async function searchGuardians() {
    const query = document.getElementById("search-query").value.trim();
    const container = document.getElementById("search-results");
    try {
      const path = `/guardians${query ? "?query=" + encodeURIComponent(query) : ""}`;
      const guardians = await apiFetch(path);
      if (guardians.length === 0) {
        container.innerHTML = '<p class="empty">No guardians matched.</p>';
        return;
      }
      container.innerHTML = guardians.map((g) => `
        <div class="guardian-card">
          <div class="name">${g.name}</div>
          <div class="meta">${g.email || "—"} ${g.phone ? " · " + g.phone : ""}</div>
          <div class="row-actions">
            <button onclick="printCredential('${g.id}', '${escapeAttr(g.name)}')">Print QR</button>
            <button class="secondary" onclick="resendActivation('${g.id}', '${escapeAttr(g.name)}')">Resend activation</button>
          </div>
        </div>`).join("");
    } catch (e) {
      container.innerHTML = `<p class="empty">Search failed: ${e.message}</p>`;
    }
  }

  renderAuthArea();
  renderChildInputs();
</script>

</body>
</html>
